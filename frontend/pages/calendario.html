<!DOCTYPE html>
<html lang="pt-BR" class="dark" style="background-color: #141313;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário — Xavier</title>

  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">try{
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-highest": "#353434",
            "error-container": "#93000a",
            "on-tertiary-fixed": "#1e1b18",
            "on-surface-variant": "#c8c6cb",
            "on-secondary": "#313032",
            "secondary-fixed": "#e5e2e4",
            "on-error": "#690005",
            "surface-dim": "#141313",
            "on-tertiary": "#34302c",
            "error": "#ffb4ab",
            "outline-variant": "#47464a",
            "surface-bright": "#3a3939",
            "surface-container-low": "#1c1b1b",
            "on-primary": "#303032",
            "secondary-container": "#474648",
            "on-tertiary-fixed-variant": "#4a4642",
            "on-tertiary-container": "#69635f",
            "on-secondary-fixed": "#1b1b1d",
            "on-secondary-container": "#b7b4b6",
            "tertiary-container": "#e9e1db",
            "surface": "#141313",
            "primary-fixed-dim": "#c8c6c9",
            "on-background": "#e5e2e1",
            "tertiary": "#ffffff",
            "on-primary-container": "#656466",
            "tertiary-fixed-dim": "#cdc5bf",
            "tertiary-fixed": "#e9e1db",
            "secondary": "#c8c6c8",
            "inverse-on-surface": "#313030",
            "on-error-container": "#ffdad6",
            "secondary-fixed-dim": "#c8c6c8",
            "inverse-primary": "#5f5e61",
            "surface-tint": "#c8c6c9",
            "primary-container": "#e4e1e4",
            "on-primary-fixed-variant": "#474649",
            "on-surface": "#e5e2e1",
            "on-primary-fixed": "#1b1b1e",
            "surface-variant": "#353434",
            "surface-container": "#201f1f",
            "outline": "#919095",
            "surface-container-high": "#2b2a2a",
            "on-secondary-fixed-variant": "#474648",
            "primary": "#ffffff",
            "inverse-surface": "#e5e2e1",
            "primary-fixed": "#e4e1e4",
            "background": "#141313",
            "surface-container-lowest": "#0e0e0e"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "container-gap": "20px",
            "inner-padding": "24px",
            "utility-panel-width": "320px",
            "sidebar-width": "260px",
            "section-margin": "32px"
          },
          "fontFamily": {
            "display-lg": ["Noto Sans"],
            "body-md": ["Noto Sans"],
            "headline-md": ["Noto Sans"],
            "headline-lg-mobile": ["Noto Sans"],
            "label-md": ["Noto Sans"],
            "body-lg": ["Noto Sans"],
            "headline-lg": ["Noto Sans"]
          },
          "fontSize": {
            "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
            "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
            "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
            "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
          }
        }
      }
    }
  }catch(_e){}</script>

  <!-- Estilos do calendário -->
  <link rel="stylesheet" href="../css/calendario.css">

  <!-- Componente sidebar -->
  <script src="../js/components/sidebar.js"></script>
</head>

<body class="overflow-hidden">

<!-- ── Sidebar ────────────────────────────────────────────────────────────── -->
<app-sidebar></app-sidebar>

<!-- ── Top Navigation Bar ────────────────────────────────────────────────── -->
<header class="flex items-center justify-between px-inner-padding h-16 w-full ml-sidebar-width fixed top-0 bg-surface border-b border-outline-variant z-40">
  <div class="flex items-center">
    <span class="font-headline-md text-headline-md font-semibold text-primary">Workspace</span>
  </div>
  <div class="flex items-center gap-4 pr-sidebar-width">
    <button class="p-2 text-on-surface-variant hover:text-primary transition-all hover:scale-105 active:scale-95">
      <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
    </button>
  </div>
</header>

<!-- ── Main Content ───────────────────────────────────────────────────────── -->
<main class="ml-sidebar-width pt-16 h-screen flex bg-background">
  <div class="flex-1 flex w-full bg-background relative">

    <!-- ── Coluna central ─────────────────────────────────────────────────── -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- Section Header -->
      <header class="h-20 flex items-center justify-between px-inner-padding border-b border-outline-variant/30">
        <div class="flex flex-col">
          <h2 class="font-headline-lg text-headline-lg text-primary">Calendário</h2>
          <span id="header-subtitle" class="text-on-surface-variant font-label-md">Julho de 2026</span>
        </div>

        <div class="flex items-center gap-4">
          <!-- Navegação anterior/próximo/hoje -->
          <div class="flex items-center gap-1">
            <button class="p-1.5 text-on-surface-variant hover:text-primary transition-colors rounded-lg hover:bg-surface-container-highest">
              <span class="material-symbols-outlined text-base">chevron_left</span>
            </button>
            <button class="px-3 py-1.5 text-on-surface-variant hover:text-primary transition-colors rounded-lg hover:bg-surface-container-highest font-label-md border border-outline-variant">
              Hoje
            </button>
            <button class="p-1.5 text-on-surface-variant hover:text-primary transition-colors rounded-lg hover:bg-surface-container-highest">
              <span class="material-symbols-outlined text-base">chevron_right</span>
            </button>
          </div>

          <!-- Seletor de view -->
          <div class="relative">
            <button id="view-selector-btn" onclick="toggleDropdown()"
              class="flex items-center gap-2 px-4 py-2 rounded-full border border-outline-variant bg-surface-container hover:bg-surface-container-highest transition-all text-on-surface font-body-md">
              <span id="current-view-label">Mês</span>
              <span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_drop_down</span>
            </button>
            <div id="view-dropdown"
              class="hidden absolute right-0 top-12 w-44 bg-surface-container-high border border-outline-variant rounded-xl shadow-2xl z-50 overflow-hidden py-1">
              <button onclick="setView('dia')"         class="view-option w-full flex items-center gap-3 px-4 py-2.5 text-on-surface font-body-md hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-sm text-on-surface-variant">calendar_view_day</span> Dia
              </button>
              <button onclick="setView('semana')"      class="view-option w-full flex items-center gap-3 px-4 py-2.5 text-on-surface font-body-md hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-sm text-on-surface-variant">calendar_view_week</span> Semana
              </button>
              <button onclick="setView('mes')"         class="view-option w-full flex items-center gap-3 px-4 py-2.5 text-on-surface font-body-md hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-sm text-on-surface-variant">calendar_month</span> Mês
              </button>
              <button onclick="setView('ano')"         class="view-option w-full flex items-center gap-3 px-4 py-2.5 text-on-surface font-body-md hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-sm text-on-surface-variant">event_note</span> Ano
              </button>
              <button onclick="setView('programacao')" class="view-option w-full flex items-center gap-3 px-4 py-2.5 text-on-surface font-body-md hover:bg-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-sm text-on-surface-variant">format_list_bulleted</span> Programação
              </button>
            </div>
          </div>

          <!-- Novo Evento -->
          <button class="bg-primary text-on-primary px-6 py-2 rounded-full font-body-md font-bold hover:opacity-90 active:scale-95 transition-all">
            Novo Evento
          </button>
        </div>
      </header>

      <!-- Área do calendário — renderizada via JS -->
      <section id="calendar-section" class="flex-1 overflow-y-auto p-4">
        <!-- Preenchido por calendario.js -->
      </section>

    </div>

    <!-- ── Painel direito ─────────────────────────────────────────────────── -->
    <aside class="w-utility-panel-width relative border-l border-outline-variant bg-surface p-6 flex flex-col gap-8 overflow-y-auto">

      <!-- Mini calendário -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-headline-md text-on-surface">Julho 2026</h3>
          <div class="flex gap-2">
            <span class="material-symbols-outlined cursor-pointer hover:text-primary">chevron_left</span>
            <span class="material-symbols-outlined cursor-pointer hover:text-primary">chevron_right</span>
          </div>
        </div>
        <div class="grid grid-cols-7 text-center text-[10px] text-on-surface-variant mb-2">
          <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
        </div>
        <div class="grid grid-cols-7 gap-y-1 text-center font-label-md">
          <span class="text-on-surface-variant/30 py-1">29</span>
          <span class="text-on-surface-variant/30 py-1">30</span>
          <span class="text-on-surface-variant py-1">1</span><span class="text-on-surface-variant py-1">2</span><span class="text-on-surface-variant py-1">3</span><span class="text-on-surface-variant py-1">4</span><span class="text-on-surface-variant py-1">5</span>
          <span class="text-on-surface-variant py-1">6</span><span class="text-on-surface-variant py-1">7</span><span class="text-on-surface-variant py-1">8</span><span class="text-on-surface-variant py-1">9</span><span class="text-on-surface-variant py-1">10</span><span class="text-on-surface-variant py-1">11</span><span class="text-on-surface-variant py-1">12</span>
          <span class="text-on-surface-variant py-1">13</span><span class="text-on-surface-variant py-1">14</span><span class="text-on-surface-variant py-1">15</span><span class="text-on-surface-variant py-1">16</span><span class="text-on-surface-variant py-1">17</span><span class="text-on-surface-variant py-1">18</span>
          <span class="py-1 bg-primary text-on-primary rounded-full font-bold">19</span>
          <span class="text-on-surface-variant py-1">20</span><span class="text-on-surface-variant py-1">21</span><span class="text-on-surface-variant py-1">22</span><span class="text-on-surface-variant py-1">23</span><span class="text-on-surface-variant py-1">24</span><span class="text-on-surface-variant py-1">25</span><span class="text-on-surface-variant py-1">26</span>
          <span class="text-on-surface-variant py-1">27</span><span class="text-on-surface-variant py-1">28</span><span class="text-on-surface-variant py-1">29</span><span class="text-on-surface-variant py-1">30</span><span class="text-on-surface-variant py-1">31</span>
          <span class="text-on-surface-variant/30 py-1">1</span>
          <span class="text-on-surface-variant/30 py-1">2</span>
        </div>
      </section>

      <!-- Próximos eventos -->
      <section class="space-y-4">
        <h3 class="font-headline-md text-on-surface mb-2">Próximos Eventos</h3>
        <div class="p-4 rounded-2xl hover:scale-[1.02] transition-transform cursor-pointer"
          style="background:rgba(255,255,255,0.04);border:1px solid rgba(71,70,74,0.4);">
          <span class="font-label-md text-primary block mb-1">10:00 - 11:30</span>
          <h4 class="font-body-md font-semibold text-on-surface mb-3">Sincronização de Design</h4>
          <div class="flex -space-x-2">
            <div class="w-8 h-8 rounded-full border-2 border-surface bg-surface-container-highest flex items-center justify-center text-[10px] font-bold text-on-surface">PX</div>
            <div class="w-8 h-8 rounded-full border-2 border-surface bg-secondary-container flex items-center justify-center text-[10px] font-bold text-on-secondary-container">AL</div>
            <div class="w-8 h-8 rounded-full border-2 border-surface bg-surface-container flex items-center justify-center text-[10px] font-bold text-on-surface">+2</div>
          </div>
        </div>
        <div class="p-4 rounded-2xl hover:scale-[1.02] transition-transform cursor-pointer"
          style="background:rgba(255,255,255,0.04);border:1px solid rgba(71,70,74,0.4);">
          <span class="font-label-md text-on-surface-variant block mb-1">14:00 - 15:00</span>
          <h4 class="font-body-md font-semibold text-on-surface mb-3">Review Mensal</h4>
          <div class="flex -space-x-2">
            <div class="w-8 h-8 rounded-full border-2 border-surface bg-surface-container-highest flex items-center justify-center text-[10px] font-bold text-on-surface">PX</div>
            <div class="w-8 h-8 rounded-full border-2 border-surface bg-secondary-container flex items-center justify-center text-[10px] font-bold text-on-secondary-container">MR</div>
          </div>
        </div>
      </section>

      <!-- Rodapé -->
      <div class="mt-auto pt-6 border-t border-outline-variant/30">
        <div class="flex items-center gap-3 text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
          <span class="material-symbols-outlined">sync</span>
          <span class="font-label-md">Sincronizado há 2m</span>
        </div>
      </div>

    </aside>
  </div>

  <!-- ── Scripts (ordem importa: views antes do controller) ─────────────────── -->
  <script src="../js/calendario/views/dia.js"></script>
  <script src="../js/calendario/views/semana.js"></script>
  <script src="../js/calendario/views/mes.js"></script>
  <script src="../js/calendario/views/ano.js"></script>
  <script src="../js/calendario/views/programacao.js"></script>
  <script src="../js/calendario/calendario.js"></script>

  <!-- Script inline: re-executado a cada navegação SPA para garantir inicialização -->
  <script>
    (function initCalendario() {
      if (typeof renderView === 'function' && typeof setView === 'function') {
        renderView('dia');
        setView('dia');
      }
    })();
  </script>
</main>

</body>
</html>
